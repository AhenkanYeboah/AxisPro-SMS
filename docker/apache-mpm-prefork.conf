# Overrides Debian's default mpm_prefork.conf (StartServers 5,
# MaxRequestWorkers 150) which has no relationship to this container's
# 512MB memory ceiling. Each worker is a full separate PHP process running
# the whole Laravel framework, so an unbounded worker count is the main
# reason the app was getting OOM-killed by Render under any concurrent load.
#
# Worst-case memory budget with this file + docker/php-production.ini:
#   MaxRequestWorkers (3) x memory_limit (128M) = 384M
#   + Apache parent process + OS overhead        ~ 60-100M
#   -----------------------------------------------------
#   well inside the 512M container cap, with margin.
#
# If you upgrade to a bigger Render plan, raise MaxRequestWorkers here and
# raise memory_limit in docker/php-production.ini to match - keep the
# product of the two under roughly 70% of the container's total memory.
<IfModule mpm_prefork_module>
    StartServers             1
    MinSpareServers          1
    MaxSpareServers          2
    MaxRequestWorkers        3
    # Recycle each worker after 500 requests. Cheap insurance against any
    # slow per-request memory creep (e.g. from a future package) turning
    # into a long-lived bloated process instead of self-correcting.
    MaxConnectionsPerChild   500
</IfModule>
