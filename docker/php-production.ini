; Production overrides for the Render 512MB container.
; Loaded from /usr/local/etc/php/conf.d/ - see Dockerfile.
;
; The stock php:8.2-apache image ships with NO memory_limit applied at all,
; which means a single PHP worker can grow unbounded until Render's hard
; container memory cap kills the whole process (that's the 503/500 crash).
; Capping it here, together with the mpm_prefork worker cap in
; docker/apache-mpm-prefork.conf, is what keeps worst-case total memory
; (workers x memory_limit + Apache/OS overhead) inside 512MB.

; --- Memory ---
; 3 Apache workers x 128M = 384M worst case, leaving ~120M headroom for the
; Apache parent process and the OS. If you raise MaxRequestWorkers in
; apache-mpm-prefork.conf, lower this to keep the product under budget.
memory_limit = 128M

; --- Uploads ---
; Largest validated upload in the app is 20MB (curriculum PDFs). post_max_size
; must be >= upload_max_filesize.
upload_max_filesize = 25M
post_max_size = 25M

; --- OPcache ---
; Was not enabled at all before - every request recompiled the entire
; framework from source on every hit, burning CPU and transient memory
; that a production box shouldn't pay per-request.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; The container image is rebuilt fresh on every deploy, so source files
; never change underneath a running container - skip the filesystem
; stat-and-compare on every request.
opcache.validate_timestamps = 0

; --- Misc hardening/perf ---
expose_php = Off
